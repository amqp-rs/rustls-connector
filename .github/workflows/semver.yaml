name: Semver compliance check

on:
  push:
    branches:
      - main
      - rustls-connector-0.23.x
    tags:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  semver_check:
    runs-on: ubuntu-latest
    steps:
      - uses: amqp-rs/actions/checkout@main
      - uses: amqp-rs/actions/semver@main
