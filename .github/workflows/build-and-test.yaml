name: Build and test

on:
  push:
    branches:
      - main
      - rustls-connector-0.23.x
  pull_request:
  schedule:
    - cron: "0 12 * * 1"

permissions:
  contents: read

jobs:
  build_and_test:
    uses: amqp-rs/actions/.github/workflows/reusable-build.yml@main
    with:
      setup: aws-lc-sys-deps
      # The default run only covers default features: also test every feature together, which
      # the tests gated on the other features need.
      test-runs: --all-features
      # The ring provider and the build without a provider feature test nothing that depends
      # on the OS or the toolchain.
      linux-stable-test-features: |
        webpki-root-certs,futures,rustls--ring
        platform-verifier,native-certs,webpki-root-certs

  # The Android-only code paths are not built by any job above, nor the compile-time pins of the
  # platform-verifier constants in the tests. Without a crypto provider feature, this needs no
  # cross C toolchain.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: amqp-rs/actions/checkout@main
      # Only for its toolchain, cache and RUSTFLAGS setup: it cannot check another target.
      - uses: amqp-rs/actions/build@main
        with:
          check: false
          test: false
      - name: Check for Android
        run: |
          rustup target add aarch64-linux-android
          cargo check --locked --target aarch64-linux-android --all-targets --no-default-features --features platform-verifier,native-certs,futures
