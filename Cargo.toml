[package]
name = "rustls-connector"
version = "0.23.9"
edition = "2024"
authors = ["Marc-Antoine Perennou <Marc-Antoine@Perennou.com>"]
description = "Connector similar to openssl or native-tls for rustls"
repository = "https://github.com/amqp-rs/rustls-connector"
readme = "README.md"
documentation = "https://docs.rs/rustls-connector"
keywords = ["tls", "rustls", "ssl", "connector", "crypto"]
categories = ["asynchronous", "cryptography", "network-programming"]
license = "BSD-2-Clause"
rust-version = "1.85.0"

[features]
default           = ["platform-verifier", "rustls--aws_lc_rs" ]
futures           = ["dep:futures-io", "dep:futures-rustls"]
logging           = ["futures-rustls?/logging", "rustls/logging"]

platform-verifier = ["dep:rustls-platform-verifier"]
native-certs      = ["dep:rustls-native-certs"]
webpki-root-certs = ["dep:webpki-root-certs"]

# rustls crypto providers. Without either, rustls picks one from its own features, if it can.
# See https://docs.rs/rustls/latest/rustls/#crate-features. for more info
rustls--aws_lc_rs  = ["futures-rustls?/aws-lc-rs", "rustls/aws_lc_rs", "rustls/prefer-post-quantum"] # default, but doesn't build everywhere
rustls--ring       = ["futures-rustls?/ring", "rustls/ring"] # more compatible, (e.g., easily builds on Windows)

[dependencies]
log = "^0.4"

[dependencies.futures-io]
version  = "^0.3"
optional = true

[dependencies.futures-rustls]
version          = "^0.26"
optional         = true
default-features = false
features         = ["tls12"]

[dependencies.rustls]
version          = "^0.23.46"
default-features = false
features         = ["std", "tls12"]

[dependencies.rustls-native-certs]
version  = "^0.8.4"
optional = true

[dependencies.rustls-platform-verifier]
version  = "^0.7"
optional = true

[dependencies.rustls-webpki]
version          = "^0.103.13"
default-features = false
features         = ["std"]

[dependencies.webpki-root-certs]
version  = "^1.0"
optional = true

[package.metadata.docs.rs]
all-features = true
